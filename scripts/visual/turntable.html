<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Model turntable</title>
<style>html,body{margin:0;height:100%;background:#f3eedf}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/node_modules/three/build/three.module.js",
  "three/addons/": "/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
// One model, one fixed camera, the game's warm window light: used by scripts/visual/capture.mjs for 6-view checks.
// ?glb=/public/assets/organisms/woodlouse.glb&view=front|back|left|right|top|three-quarter
import * as THREE from 'three'
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js'
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js'

const query = new URLSearchParams(location.search)
const view = query.get('view') ?? 'three-quarter'
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true })
renderer.setSize(innerWidth, innerHeight)
renderer.setPixelRatio(1)
renderer.shadowMap.enabled = true
renderer.shadowMap.type = THREE.PCFSoftShadowMap
renderer.toneMapping = THREE.ACESFilmicToneMapping
document.body.appendChild(renderer.domElement)
const scene = new THREE.Scene()
scene.background = new THREE.Color('#f3eedf')
scene.add(new THREE.HemisphereLight('#dfe9f2', '#7a6a52', 1.1))
const sun = new THREE.DirectionalLight('#ffe2b8', 2.4)
sun.castShadow = true
sun.shadow.mapSize.set(2048, 2048)
scene.add(sun, sun.target)
const camera = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.001, 100)

const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder)
loader.load(query.get('glb'), (gltf) => {
  const model = gltf.scene
  model.traverse((node) => { if (node.isMesh) { node.castShadow = true; node.receiveShadow = true } })
  scene.add(model)
  const box = new THREE.Box3().setFromObject(model)
  const size = box.getSize(new THREE.Vector3())
  const center = box.getCenter(new THREE.Vector3())
  const radius = Math.max(size.x, size.y, size.z) * 0.5 || 1
  // Ground disc under the model so contact shadows show.
  const ground = new THREE.Mesh(new THREE.CircleGeometry(radius * 4, 48), new THREE.MeshStandardMaterial({ color: '#d9cdb4', roughness: 1 }))
  ground.rotation.x = -Math.PI / 2
  ground.position.y = box.min.y
  ground.receiveShadow = true
  scene.add(ground)
  const directions = {
    front: [0, 0.15, 1], back: [0, 0.15, -1], left: [-1, 0.15, 0], right: [1, 0.15, 0],
    top: [0.001, 1, 0.001], 'three-quarter': [0.8, 0.55, 0.9],
  }
  const dir = new THREE.Vector3(...(directions[view] ?? directions['three-quarter'])).normalize()
  const distance = radius / Math.sin(THREE.MathUtils.degToRad(camera.fov / 2)) * 1.15
  camera.position.copy(center).addScaledVector(dir, distance)
  camera.lookAt(center)
  sun.position.copy(center).add(new THREE.Vector3(-1.2, 2.2, 1.4).multiplyScalar(radius * 3))
  sun.target.position.copy(center)
  const cam = sun.shadow.camera
  cam.left = cam.bottom = -radius * 3; cam.right = cam.top = radius * 3; cam.near = 0.001; cam.far = radius * 20
  cam.updateProjectionMatrix()

  let triangles = 0, meshes = 0
  const materials = new Set(), textures = new Set()
  model.traverse((node) => {
    if (!node.isMesh) return
    meshes++
    const geometry = node.geometry
    const count = geometry.index ? geometry.index.count / 3 : geometry.attributes.position.count / 3
    triangles += count * (node.isInstancedMesh ? node.count : 1)
    for (const material of [node.material].flat()) {
      materials.add(material.uuid)
      for (const key of ['map', 'normalMap', 'roughnessMap', 'metalnessMap', 'aoMap', 'emissiveMap']) if (material[key]) textures.add(material[key].uuid)
    }
  })
  renderer.render(scene, camera)
  window.__stats = {
    triangles: Math.round(triangles), meshes, materials: materials.size, textures: textures.size,
    sizeUnits: size.toArray().map((v) => +v.toFixed(4)),
  }
}, undefined, (error) => { window.__stats = { error: String(error) } })
</script>
</body>
</html>
